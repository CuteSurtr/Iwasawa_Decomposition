name: build

on:
  push:
    branches: [main]
  pull_request:

# One build per ref; newer pushes cancel older in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check the proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the toolchain from lean-toolchain, runs `lake exe cache get`
      # to pull the prebuilt Mathlib, then `lake build` to elaborate Iwasawa.lean.
      - name: Build with Lean and Mathlib
        uses: leanprover/lean-action@v1
